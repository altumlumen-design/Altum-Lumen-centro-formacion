<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0c2b4d">
  <title>Página no encontrada | ALTUM LUMEN</title>
  <script>
    (function () {
      'use strict';
      const routes = Object.freeze({
        'aula/': 'aula-virtual.html',
        'curso/ia-derecho-4/': 'ia-derecho-4ta-edicion.html',
        'curso/formulacion-inversiones-ia/': 'formulacion-inversiones-publicas-ia.html',
        'curso/serenazgo-municipal/': 'gestion-servicio-serenazgo-municipal.html',
        'curso/ia-derecho-3/': 'ia-derecho-3ra-edicion.html',
        'curso/ia-derecho-2/': 'ia-derecho-2da-edicion.html',
        'curso/ia-derecho-1/': 'ia-derecho-1ra-edicion.html',
        'programa/gerencia-seguridad-criminologia/': 'pae-gerencia-seguridad-criminologia.html',
        'programa/orden-interno-seguridad-ciudadana/': 'diplomado-orden-interno-seguridad-ciudadana.html',
        'programa/direccion-gestion-seguridad-ciudadana/': 'diplomado-direccion-gestion-seguridad-ciudadana.html',
        'programa/interculturalidad-convivencia-desarrollo-social/': 'diplomado-interculturalidad-convivencia-desarrollo-social.html',
        'curso/proyectos-inversion-publica-ia/': 'proyectos-inversion-publica-ia.html'
      });

      let pathname;
      try { pathname = decodeURIComponent(window.location.pathname).replace(/\/{2,}/g, '/'); }
      catch (_) { pathname = window.location.pathname.replace(/\/{2,}/g, '/'); }

      for (const [cleanRoute, legacyFile] of Object.entries(routes)) {
        const suffix = '/' + cleanRoute;
        const cleanWithoutSlash = cleanRoute.replace(/\/$/, '');
        const suffixWithoutSlash = '/' + cleanWithoutSlash;
        const matchesWithSlash = pathname.endsWith(suffix);
        const matchesWithoutSlash = pathname.endsWith(suffixWithoutSlash);
        if (matchesWithSlash || matchesWithoutSlash) {
          const matchedLength = matchesWithSlash ? cleanRoute.length : cleanWithoutSlash.length;
          let rootPath = pathname.slice(0, pathname.length - matchedLength);
          if (!rootPath.endsWith('/')) rootPath += '/';
          window.location.replace(rootPath + legacyFile + window.location.search + window.location.hash);
          return;
        }
      }
    })();
  </script>
  <style>

  </style>
</head>

  <main>
