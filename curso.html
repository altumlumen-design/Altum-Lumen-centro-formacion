<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Virtual | ALTUM LUMEN</title>
  <meta name="theme-color" content="#0d263a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="logo-centro-formacion.jpg">
  <link rel="apple-touch-icon" href="logo-centro-formacion.jpg">
  <link rel="stylesheet" href="aula-estilos.css?v=20260915-aula24">
  <link rel="stylesheet" href="aula-dynamic-course.css?v=20260921-aula336-eval">
  <script type="module" src="aula-dynamic-entry.js?v=20260921-aula358-eval"></script>
  <style>
    .evaluation-rules{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.evaluation-rules span{display:inline-flex;align-items:center;padding:6px 8px;border-radius:999px;background:#eef6ff;color:#245d8c;font-size:10px;font-weight:800}.evaluation-comment{margin-top:9px;padding:9px 11px;border-left:3px solid #6b3fa0;border-radius:8px;background:#f7f3fb;color:#5c486c;font-size:11px;line-height:1.5}.evaluation-deadline{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 11px;border:1px solid #f0d49b;border-radius:11px;background:#fff9ed;color:#8a5c08}.evaluation-deadline>span{font-size:17px}.evaluation-deadline small,.evaluation-deadline strong{display:block}.evaluation-deadline small{font-size:10px;color:#8a6c35}.evaluation-deadline strong{margin-top:2px;font-size:12px;color:#9c5c00}.evaluation-deadline.is-expired{border-color:#e3c6c6;background:#fff3f3;color:#9c3030}.evaluation-deadline.is-expired strong{color:#9c3030}.evaluation-pdf-link{display:inline-flex;margin-top:9px;color:#5f3c8a;font-size:10.5px;font-weight:900;text-decoration:none}.evaluation-pdf-link:hover{text-decoration:underline}@media(max-width:620px){.evaluation-rules{display:grid;grid-template-columns:1fr}.evaluation-rules span{justify-content:center}.evaluation-deadline{align-items:flex-start}}
  </style>
</head>
<body class="aula-dynamic-page">
  <header class="aula-site-header">
    <div class="container aula-header-inner">
      <a class="aula-brand" href="index.html" aria-label="Ir al Centro de Formación y Capacitación Profesional">
        <img src="logo-centro-formacion.jpg" alt="Altum Lumen">
        <span><small>Centro de Formación</small><strong>Aula Virtual</strong></span>
      </a>
      <nav class="aula-header-nav" aria-label="Navegación del aula">
        <a class="aula-nav-link" href="aula-virtual.html">Mis cursos</a>
        <div id="courseUserArea"></div>
      </nav>
    </div>
  </header>

  <main class="dynamic-main">
    <section id="dynamicLoading" class="dynamic-state" aria-live="polite">
      <div class="dynamic-spinner" aria-hidden="true"></div>
      <h1>Abriendo tu aula…</h1>
      <p>Cargando recursos del curso…</p>
    </section>

    <section id="dynamicError" class="dynamic-state dynamic-error" hidden>
      <h1>No pudimos abrir el curso</h1>
      <p id="dynamicErrorMessage">Inténtalo nuevamente desde tu Aula Virtual.</p>
      <a class="dynamic-btn secondary" href="aula-virtual.html">Volver a mis cursos</a>
    </section>

    <div id="dynamicCourse" hidden></div>
  </main>

  <footer class="portal-footer">© Altum Lumen S.A.C. · Dirección Académica · Aula Virtual</footer>
</body>
</html>
