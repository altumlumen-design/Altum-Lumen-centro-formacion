<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#eef5fb"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2238"/>
      <stop offset="100%" stop-color="#2E6F9E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B10D1B"/>
      <stop offset="100%" stop-color="#D4142A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- planos suaves -->
  <path d="M0,740 C240,620 410,650 610,560 C820,465 1010,310 1600,355 L1600,1000 L0,1000 Z" fill="#dcecf6" opacity=".58"/>
  <path d="M0,810 C310,690 520,765 780,640 C1040,515 1250,505 1600,430 L1600,1000 L0,1000 Z" fill="#ffffff" opacity=".70"/>
  <path d="M-80,100 C260,55 460,85 685,160 C930,243 1190,155 1680,75" fill="none" stroke="#2E6F9E" stroke-width="2" opacity=".12"/>
  <path d="M-80,155 C260,105 480,132 705,208 C945,290 1195,222 1680,125" fill="none" stroke="#B10D1B" stroke-width="2" opacity=".08"/>

  <!-- libro abierto institucional -->
  <g transform="translate(255 510)" opacity=".30">
    <path d="M0,35 C115,-18 255,-16 395,56 L395,280 C255,211 116,209 0,266 Z" fill="#ffffff" stroke="#0E2238" stroke-width="10"/>
    <path d="M395,56 C535,-16 675,-18 790,35 L790,266 C674,209 535,211 395,280 Z" fill="#ffffff" stroke="#0E2238" stroke-width="10"/>
    <path d="M395,56 L395,280" stroke="#0E2238" stroke-width="7"/>
    <path d="M80,95 C165,65 250,68 335,100" fill="none" stroke="#2E6F9E" stroke-width="8" opacity=".70"/>
    <path d="M80,150 C165,120 250,123 335,155" fill="none" stroke="#2E6F9E" stroke-width="8" opacity=".52"/>
    <path d="M455,100 C540,68 625,65 710,95" fill="none" stroke="#B10D1B" stroke-width="8" opacity=".52"/>
    <path d="M455,155 C540,123 625,120 710,150" fill="none" stroke="#B10D1B" stroke-width="8" opacity=".38"/>
  </g>

  <!-- birrete / posgrado -->
  <g transform="translate(1030 240)" opacity=".25">
    <path d="M0,130 L235,38 L470,130 L235,222 Z" fill="url(#navy)"/>
    <path d="M116,166 L116,300 C185,355 294,355 354,300 L354,166 L235,213 Z" fill="#ffffff" stroke="#0E2238" stroke-width="9"/>
    <path d="M470,130 L470,270" stroke="#B10D1B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="470" cy="292" r="24" fill="#B10D1B"/>
  </g>

  <!-- red académica / verificación -->
  <g transform="translate(1065 615)" opacity=".26">
    <circle cx="80" cy="80" r="34" fill="#0E2238"/>
    <circle cx="250" cy="40" r="28" fill="#2E6F9E"/>
    <circle cx="360" cy="168" r="34" fill="#0E2238"/>
    <circle cx="188" cy="220" r="25" fill="#B10D1B"/>
    <path d="M80,80 L250,40 L360,168 L188,220 L80,80 L188,220 L250,40" fill="none" stroke="#0E2238" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102,58 L132,88 L198,18" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sello abstracto -->
  <g transform="translate(126 188)" opacity=".18">
    <circle cx="120" cy="120" r="104" fill="none" stroke="#0E2238" stroke-width="12"/>
    <circle cx="120" cy="120" r="72" fill="none" stroke="#B10D1B" stroke-width="7"/>
    <path d="M70,122 L108,160 L176,76" fill="none" stroke="#0E2238" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- luces suaves -->
  <circle cx="1320" cy="140" r="230" fill="#2E6F9E" opacity=".08" filter="url(#soft)"/>
  <circle cx="320" cy="910" r="280" fill="#B10D1B" opacity=".055" filter="url(#soft)"/>
</svg>