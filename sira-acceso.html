  <style>
    :root{color-scheme:light;--navy:#0d2947;--blue:#1769aa;--red:#c8192e;--text:#10243a;--muted:#687d91}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,rgba(8,39,67,.88),rgba(24,78,123,.80)),url("cielo.jpg") center/cover fixed}
    main{width:min(520px,100%);padding:clamp(28px,7vw,46px);text-align:center;border:1px solid rgba(255,255,255,.75);border-radius:26px;background:rgba(255,255,255,.97);box-shadow:0 28px 80px rgba(3,28,52,.32)}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;color:#fff;background:linear-gradient(145deg,var(--navy),var(--blue));font-weight:900;letter-spacing:.08em;box-shadow:0 14px 30px rgba(13,41,71,.24)}
    .eyebrow{font-size:.72rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--red)}
    h1{margin:9px 0 10px;font-size:clamp(2rem,8vw,3rem);line-height:1;color:var(--navy)}
    p{margin:0 auto;max-width:38ch;color:var(--muted);line-height:1.65}
    .status{min-height:24px;margin-top:22px;font-size:.92rem;font-weight:700;color:#385a76}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;padding:12px 18px;border:0;border-radius:13px;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}
    button{color:#fff;background:linear-gradient(180deg,#1a70b3,#0c5b99);box-shadow:0 12px 24px rgba(16,95,157,.22)}
    button:disabled{opacity:.72;cursor:wait}
    .back{display:inline-block;margin-top:18px;color:#58748b;font-size:.83rem;font-weight:700;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main aria-labelledby="siraTitle">
    <div class="mark" aria-hidden="true">AL</div>
    <div class="eyebrow">Acceso institucional</div>
    <h1 id="siraTitle">SIRA</h1>
    <p>Te estamos llevando al sistema oficial y actualizado de ALTUM LUMEN.</p>
    <div id="siraStatus" class="status" role="status" aria-live="polite">Conectando con SIRA 3.7.47…</div>
    <button id="siraLaunch" type="button">Ingresar a SIRA</button>
    <a class="back" href="index.html">← Volver al Centro de Formación</a>
    <noscript>
      <a class="button" href="https://script.google.com/macros/s/AKfycbysdGK_9D_nDDrhj6pa53_4H6eOT0U3k_KBqZ1iX_Co7oTCvdEAqnE5Sac1ZRAugfZo/exec?source=centro-formacion&amp;v=347">Continuar a SIRA</a>
    </noscript>
  </main>
  <script type="module" src="sira-acceso.js?v=20261017-sira347"></script>
</body>
